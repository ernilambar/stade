name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - "Sources/**"
      - "Tests/**"
      - "Resources/**"
      - "Config/**"
      - "Package.swift"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

  build-and-test:
    name: Build and test
    if: ${{ !github.event.pull_request.draft }}
    # macOS is required for SwiftUI and AppKit. Tests run here rather than
    # locally: `swift test` with the Command Line Tools 6.4 intermittently
    # fails to load the swift-testing macro plugin.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Show toolchain
        run: swift --version

      # Compiler warnings are the lint gate for Swift code.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # Builds the app bundle the same way a release does.
      - name: Bundle
        run: ./scripts/bundle.sh --release
